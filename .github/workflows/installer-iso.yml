name: Rowyn installer ISO

on:
  workflow_run:
    workflows: [Rowyn CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact existing signed Rowyn sha256 digest (no mutable tag)
        required: true
        type: string
      source_sha:
        description: Original payload commit (40 lowercase hex characters)
        required: true
        type: string
  # ISO-only changes validate here; dispatch an explicit digest to rebuild the ISO.
  # Combined image/ISO changes get exactly one ISO via workflow_run.
  push:
    branches: [main]
    paths:
      - .github/workflows/installer-iso.yml
      - .github/actions/**
      - build/custom-installer-iso.sh
      - shared/kde-dark-defaults.sh
      - shared/kde-wallpaper-defaults.sh
      - shared/wallpaper/**
      - shared/installed-desktop-defaults.sh
      - build/ubuntu-*
      - build/configure-live.sh
      - build/assemble-iso.sh
      - build/rootful-podman.sh
      - build/iso-source.py
      - build/validate.sh
      - build/tests/**

permissions:
  contents: read

concurrency:
  group: rowyn-iso-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/kyth-os/rowyn
  KYTH_INSTALLER_COMMIT: 2baf8496b5aa904c0784f4290df743ee17edae48
  UBUNTU_LIVE_IMAGE: docker.io/library/ubuntu@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719

jobs:
  validate:
    if: >-
      github.repository == 'kyth-os/Rowyn' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    name: Validate source and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Install validation tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying" >&2
            sleep 5
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update failed after three attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: Validate Rowyn source and CI contracts
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ROWYN_MOUNT_FIXTURE_PRIVILEGED: "1"
        run: ./build/validate.sh

  iso:
    name: Build custom installer ISO
    needs: validate
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Resolve exact signed image
        id: source
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build/iso-source.py

      - name: Install Cosign for source verification and ISO attestation
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Verify fixed payload signer before privileged build
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          SOURCE_IMAGE: ${{ steps.source.outputs.source_image }}
        run: |
          cosign verify \
            --certificate-identity 'https://github.com/kyth-os/Rowyn/.github/workflows/build.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${SOURCE_IMAGE}"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Ensure podman
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v podman >/dev/null || ! command -v mkfs.btrfs >/dev/null || ! command -v skopeo >/dev/null || ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends podman btrfs-progs skopeo python3-yaml
          fi
          podman --version
          mkfs.btrfs --version
          skopeo --version

      - name: Provision compressed Podman storage
        uses: ./.github/actions/setup-compressed-storage
        with:
          size: 65G
          mount-point: /var/lib/containers/storage
          image-path: /mnt/rowyn-podman-storage.img
          runroot: /run/containers/storage

      - name: Verify available space for custom ISO build
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          available_kb="$(df --output=avail /mnt | awk 'NR == 2 {print $1}')"
          required_kb=$((28 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "::error::Need at least 28 GiB free on /mnt for the custom ISO build; found $((available_kb / 1024 / 1024)) GiB." >&2
            exit 1
          fi

      - name: Fetch pinned custom installer environment
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/rowyn-iso-scratch
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kyth-os/kyth.git "${RUNNER_TEMP}/kyth-installer"
          git -C "${RUNNER_TEMP}/kyth-installer" fetch --depth 1 origin "${KYTH_INSTALLER_COMMIT}"
          git -C "${RUNNER_TEMP}/kyth-installer" checkout --detach "${KYTH_INSTALLER_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/kyth-installer" rev-parse HEAD)" = "${KYTH_INSTALLER_COMMIT}"

      - name: Pull the exact image built in this run
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.source.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.source.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${IMAGE_REF}"
          test -n "${IMAGE_DIGEST}"
          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          sudo podman pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          skopeo inspect --no-creds "docker://${IMAGE_NAME}@${IMAGE_DIGEST}" >/dev/null
          {
            echo '### ISO source image'
            echo "- ref: \`${IMAGE_REF}\`"
            echo "- digest: \`${IMAGE_DIGEST}\`"
            echo "- installer: Ubuntu live/compiler \`${UBUNTU_LIVE_IMAGE}\`; pinned Rust source \`${KYTH_INSTALLER_COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight pinned custom installer adapter
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.source.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.source.outputs.image_digest }}
          SOURCE_TAG: ${{ steps.source.outputs.source_sha }}
          KYTH_SOURCE_DIR: ${{ runner.temp }}/kyth-installer
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
          UBUNTU_LIVE_IMAGE: ${{ env.UBUNTU_LIVE_IMAGE }}
          TMPDIR: /mnt/rowyn-iso-scratch
          ROWYN_CUSTOM_INSTALLER_PREFLIGHT: "1"
        run: ./build/custom-installer-iso.sh

      - name: Build custom installer ISO
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.source.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.source.outputs.image_digest }}
          SOURCE_TAG: ${{ steps.source.outputs.source_sha }}
          KYTH_SOURCE_DIR: ${{ runner.temp }}/kyth-installer
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
          UBUNTU_LIVE_IMAGE: ${{ env.UBUNTU_LIVE_IMAGE }}
          TMPDIR: /mnt/rowyn-iso-scratch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./build/custom-installer-iso.sh

      - name: ISO summary, checksums, and signature
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mapfile -t isos < <(find output -type f -name 'rowyn-custom-installer-*.iso' -print)
          (( ${#isos[@]} == 1 ))
          iso="${isos[0]}"
          checksum="${iso}.sha256"
          bundle="${iso}.sigstore.json"
          (
            cd "$(dirname "${iso}")"
            sha256sum -- "$(basename "${iso}")" > "$(basename "${checksum}")"
          )
          cat "${checksum}" | tee -a "$GITHUB_STEP_SUMMARY"
          cosign sign-blob --yes --bundle "${bundle}" "${checksum}"
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/installer-iso\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${checksum}"
          ls -lh "${iso}" "${checksum}" "${bundle}"

      - name: Upload custom installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: rowyn-custom-installer-iso-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}
          path: |
            output/rowyn-custom-installer-*.iso
            output/rowyn-custom-installer-*.json
            output/rowyn-custom-installer-*.iso.sha256
            output/rowyn-custom-installer-*.iso.sigstore.json
            output/rowyn-custom-installer-*.iso.*-report.txt
          retention-days: 7
          if-no-files-found: error
