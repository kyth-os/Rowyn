name: Rowyn CI

# Validate the source before spending a hosted runner on the bootc image.
# The image and ISO jobs are deliberately separate so the ISO only runs after
# the exact image built by this run has been inspected and published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rowyn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/kyth-os/rowyn
  KYTH_INSTALLER_COMMIT: 2baf8496b5aa904c0784f4290df743ee17edae48
  KYTH_INSTALLER_BASE_IMAGE: ghcr.io/kyth-os/kyth@sha256:cc141d5c85f605544c69809daf11fe5aa9cc4aaa23a21325b35b08680a33db4a

jobs:
  validate:
    name: Validate source and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying" >&2
            sleep 5
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update failed after three attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: Validate Rowyn source and CI contracts
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./build/validate.sh

  build:
    name: Build and publish image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Ensure podman
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version

      - name: Fetch build assets (toolchain tarball, bootc source, vendored deps)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./build/fetch-assets.sh

      - name: Build image (offline Containerfile)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: sudo podman build -t rowyn:ci .

      - name: Inspect image and run image smoke checks
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo podman run --rm rowyn:ci cat /usr/lib/os-release
          sudo podman run --rm --entrypoint /bin/sh rowyn:ci -euxc '
            grep -Fqx "NAME=\"Rowyn\"" /usr/lib/os-release
            grep -Fqx "ID=rowyn" /usr/lib/os-release
            grep -Fqx "ID_LIKE=\"ubuntu debian\"" /usr/lib/os-release
            id rowyn
            test -s /etc/sudoers.d/90-rowyn-spike
            test -s /usr/lib/tmpfiles.d/rowyn-spike.conf
            test -s /etc/NetworkManager/system-connections/rowyn-wired.nmconnection
            test -s /etc/NetworkManager/conf.d/99-rowyn-managed.conf
            test "$(readlink -f /etc/systemd/system/default.target)" = /usr/lib/systemd/system/graphical.target
            test -e /etc/systemd/system/display-manager.service
            test -e /etc/systemd/system/multi-user.target.wants/NetworkManager.service
            test "$(readlink /etc/systemd/system/systemd-networkd.service)" = /dev/null
          '
          {
            echo '### Image'
            sudo podman image inspect rowyn:ci --format '- size: {{.Size}} bytes'
            sudo podman image inspect rowyn:ci --format '- local digest: {{.Digest}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push immutable image and spike alias to GHCR
        id: publish
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_ref="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          digest_file="${RUNNER_TEMP}/rowyn-image.digest"

          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag rowyn:ci "${image_ref}"
          sudo podman tag rowyn:ci "${IMAGE_REPOSITORY}:spike"

          sudo podman push --digestfile "${digest_file}" "${image_ref}"
          image_digest="$(cat "${digest_file}")"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Keep the human-friendly spike tag, but never use it as the input to
          # a downstream job. The ISO consumes image_ref@image_digest below.
          sudo podman push "${IMAGE_REPOSITORY}:spike"

          {
            echo "image_ref=${image_ref}"
            echo "image_digest=${image_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '### Published image'
            echo "- ref: \`${image_ref}\`"
            echo "- digest: \`${image_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write immutable image metadata
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          mkdir -p output
          jq -n \
            --arg image "${IMAGE_REF}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{image: $image, digest: $digest, source_sha: $source_sha, run_id: $run_id}' \
            > output/image-build-metadata.json

      - name: Upload immutable image metadata
        uses: actions/upload-artifact@v4
        with:
          name: rowyn-image-metadata-${{ github.sha }}
          path: output/image-build-metadata.json
          retention-days: 7
          if-no-files-found: error

  # Sign the exact published image before the custom installer environment
  # consumes it. The installer embeds the signature bundle and the digest;
  # unsigned registry sources are rejected by the live daemon.
  sign:
    name: Sign published image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Sign exact image digest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${IMAGE_REF}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  # Installer ISO, built strictly after the exact image is published and signed.
  # This deliberately uses Rowyn's custom Kyth installer environment and
  # Titanoboa assembly path, not the distro-specific RPM installer path.
  iso:
    name: Build custom installer ISO
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Ensure podman
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v podman >/dev/null || ! command -v mkfs.btrfs >/dev/null || ! command -v skopeo >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends podman btrfs-progs skopeo
          fi
          podman --version
          mkfs.btrfs --version
          skopeo --version

      - name: Provision compressed Podman storage
        uses: ./.github/actions/setup-compressed-storage
        with:
          size: 65G
          mount-point: /var/lib/containers/storage
          image-path: /mnt/rowyn-podman-storage.img
          runroot: /run/containers/storage

      - name: Verify available space for custom ISO build
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          available_kb="$(df --output=avail /mnt | awk 'NR == 2 {print $1}')"
          required_kb=$((28 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "::error::Need at least 28 GiB free on /mnt for the custom ISO build; found $((available_kb / 1024 / 1024)) GiB." >&2
            exit 1
          fi

      - name: Fetch pinned custom installer environment
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kyth-os/kyth.git "${RUNNER_TEMP}/kyth-installer"
          git -C "${RUNNER_TEMP}/kyth-installer" fetch --depth 1 origin "${KYTH_INSTALLER_COMMIT}"
          git -C "${RUNNER_TEMP}/kyth-installer" checkout --detach "${KYTH_INSTALLER_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/kyth-installer" rev-parse HEAD)" = "${KYTH_INSTALLER_COMMIT}"

      - name: Pull the exact image built in this run
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${IMAGE_REF}"
          test -n "${IMAGE_DIGEST}"
          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          sudo podman pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          skopeo inspect --no-creds "docker://${IMAGE_NAME}@${IMAGE_DIGEST}" >/dev/null
          {
            echo '### ISO source image'
            echo "- ref: \`${IMAGE_REF}\`"
            echo "- digest: \`${IMAGE_DIGEST}\`"
            echo "- installer: custom Kyth environment at \`${KYTH_INSTALLER_COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight pinned custom installer adapter
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          SOURCE_TAG: ${{ github.sha }}
          KYTH_SOURCE_DIR: ${{ runner.temp }}/kyth-installer
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
          KYTH_INSTALLER_BASE_IMAGE: ${{ env.KYTH_INSTALLER_BASE_IMAGE }}
          ROWYN_CUSTOM_INSTALLER_PREFLIGHT: "1"
        run: ./build/custom-installer-iso.sh

      - name: Build custom installer ISO
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          SOURCE_TAG: ${{ github.sha }}
          KYTH_SOURCE_DIR: ${{ runner.temp }}/kyth-installer
          KYTH_INSTALLER_COMMIT: ${{ env.KYTH_INSTALLER_COMMIT }}
          KYTH_INSTALLER_BASE_IMAGE: ${{ env.KYTH_INSTALLER_BASE_IMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./build/custom-installer-iso.sh

      - name: Install Cosign for ISO attestation
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: ISO summary, checksums, and signature
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mapfile -t isos < <(find output -type f -name 'rowyn-custom-installer-*.iso' -print)
          (( ${#isos[@]} == 1 ))
          iso="${isos[0]}"
          checksum="${iso}.sha256"
          bundle="${iso}.sigstore.json"
          (
            cd "$(dirname "${iso}")"
            sha256sum -- "$(basename "${iso}")" > "$(basename "${checksum}")"
          )
          cat "${checksum}" | tee -a "$GITHUB_STEP_SUMMARY"
          cosign sign-blob --yes --bundle "${bundle}" "${checksum}"
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${checksum}"
          ls -lh "${iso}" "${checksum}" "${bundle}"

      - name: Upload custom installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: rowyn-custom-installer-iso-${{ github.sha }}
          path: |
            output/rowyn-custom-installer-*.iso
            output/rowyn-custom-installer-*.json
            output/rowyn-custom-installer-*.iso.sha256
            output/rowyn-custom-installer-*.iso.sigstore.json
          retention-days: 7
          if-no-files-found: error
