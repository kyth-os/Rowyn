name: Rowyn CI

# Payload release identity stays at build.yml@refs/heads/main.
on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - os-release
      - shared/**
      - keys/**
      - build/fetch-assets.sh
      - build/ubuntu-hub-source.py
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rowyn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/kyth-os/rowyn

jobs:
  validate:
    name: Validate source and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying" >&2
            sleep 5
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update failed after three attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: Validate Rowyn source and CI contracts
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ROWYN_MOUNT_FIXTURE_PRIVILEGED: "1"
        run: ./build/validate.sh

  build:
    name: Build and publish image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'kyth-os/Rowyn'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Ensure podman
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends podman
          fi
          podman --version

      - name: Fetch build assets (toolchain tarball, bootc source, vendored deps)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./build/fetch-assets.sh

      - name: Fetch and port pinned Kyth System Hub source
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          KYTH_HUB_COMMIT: 2baf8496b5aa904c0784f4290df743ee17edae48
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kyth-os/kyth.git "${RUNNER_TEMP}/kyth-hub"
          git -C "${RUNNER_TEMP}/kyth-hub" fetch --depth 1 origin "${KYTH_HUB_COMMIT}"
          git -C "${RUNNER_TEMP}/kyth-hub" checkout --detach "${KYTH_HUB_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/kyth-hub" rev-parse HEAD)" = "${KYTH_HUB_COMMIT}"
          python3 build/ubuntu-hub-source.py "${RUNNER_TEMP}/kyth-hub" hub-source

      - name: Build image (offline Containerfile)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: sudo podman build -t rowyn:ci .

      - name: Inspect image and run image smoke checks
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo podman run --rm rowyn:ci cat /usr/lib/os-release
          sudo podman run --rm --entrypoint /bin/sh rowyn:ci -euxc '
            grep -Fqx "NAME=\"Rowyn\"" /usr/lib/os-release
            grep -Fqx "ID=rowyn" /usr/lib/os-release
            grep -Fqx "ID_LIKE=\"ubuntu debian\"" /usr/lib/os-release
            # No baked-in login users: neither the removed spike account
            # nor the account from the Ubuntu base image may survive into
            # the payload — the login screen must offer only the account
            # the installer creates.
            ! id rowyn
            ! id ubuntu
            ! grep -Eq "^(rowyn|ubuntu):" /etc/passwd
            if guidance=$(/usr/sbin/apt-get install rowyn-test-package 2>&1); then
              echo "host apt-get unexpectedly succeeded" >&2
              exit 1
            fi
            printf "%s\n" "$guidance" | grep -Fq Distrobox
            printf "%s\n" "$guidance" | grep -Fq Discover
            ! command -v plasma-welcome
            test ! -e /usr/lib/x86_64-linux-gnu/qt6/plugins/kf6/kded/kded_plasma_welcome.so
            test -x /usr/bin/spectacle
            test -x /usr/bin/gwenview
            test -x /usr/bin/okular
            test -x /usr/bin/ark
            test -x /usr/bin/kate
            test -x /usr/bin/kcalc
            test -x /usr/bin/kdeconnect-app
            test -x /usr/bin/elisa
            test -x /usr/bin/skanpage
            test -x /usr/sbin/cupsd
            test -x /usr/bin/plasma-print-queue
            test -e /etc/systemd/system/multi-user.target.wants/cups.service
            test -e /etc/systemd/system/sockets.target.wants/cups.socket
            test -e /etc/systemd/system/multi-user.target.wants/cups-browsed.service
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/plasma/kcms/systemsettings/kcm_plymouth.so
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/plasma/kcms/systemsettings/kcm_printer_manager.so
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/kf6/kio/admin.so
            test -x /usr/bin/curl
            test -x /usr/bin/htop
            test -x /usr/bin/ping
            test "$(readlink /etc/systemd/system/ufw.service)" = /dev/null
            test -x /usr/bin/rowyn-hub-shell
            if ldd /usr/bin/rowyn-hub-shell | grep -Fq "not found"; then
              echo "rowyn-hub-shell has unresolved runtime libraries" >&2
              exit 1
            fi
            test -s /usr/share/applications/com.rowyn.hub.desktop
            test -s /usr/share/icons/hicolor/512x512/apps/com.rowyn.hub.png
            test -x /usr/bin/openconnect
            test -s /etc/vpnc/vpnc-script
            test -x /usr/bin/ksshaskpass
            test -x /usr/bin/firewall-cmd
            test -x /usr/bin/rowyn-safe-upgrade
            test -x /usr/bin/rowyn-bootc-guard
            test -x /usr/libexec/rowyn-finalize-staged
            test -s /etc/sudoers.d/rowyn-upgrade
            # New accounts are seeded a permissive per-user containers
            # policy (rootless podman/distrobox pulls from any registry);
            # the strict system policy in /etc/containers stays untouched
            # for root and bootc.
            test -s /etc/skel/.config/containers/policy.json
            python3 -m json.tool /etc/skel/.config/containers/policy.json > /dev/null
            test -s /usr/share/plymouth/themes/rowyn/rowyn.plymouth
            test -s /usr/share/plymouth/themes/rowyn/rowyn.script
            test -s /usr/share/plymouth/themes/rowyn/rowyn-logo.png
            grep -Fx "Theme=rowyn" /etc/plymouth/plymouthd.conf
            test "$(readlink -f /usr/share/plymouth/themes/default.plymouth)" = /usr/share/plymouth/themes/rowyn/rowyn.plymouth
            grep -Fq "\"splash\"" /usr/lib/bootc/kargs.d/99-rowyn-splash.toml
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -Fq "usr/share/plymouth/themes/rowyn/rowyn.script"
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -Fq "usr/share/plymouth/themes/rowyn/rowyn-logo.png"
            test -s /usr/share/wallpapers/RowynBlack/contents/images/3840x2160.png
            for theme in org.kde.breeze.desktop org.kde.breezedark.desktop; do
              defaults=/usr/share/plasma/look-and-feel/$theme/contents/defaults
              test "$(kreadconfig6 --file "$defaults" --group Wallpaper --key Image)" = RowynBlack
            done
            test ! -e /etc/sudoers.d/90-rowyn-spike
            test ! -e /usr/lib/tmpfiles.d/rowyn-spike.conf
            test -s /usr/share/zoneinfo/America/Detroit
            test -s /usr/share/zoneinfo/US/Michigan
            test "$(readlink /etc/localtime)" = /usr/share/zoneinfo/Etc/UTC
            grep -Fx "Etc/UTC" /etc/timezone
            test -s /usr/lib/systemd/system/systemd-timedated.service
            test -x /usr/lib/polkit-1/polkitd
            test -s /etc/NetworkManager/system-connections/rowyn-wired.nmconnection
            test -s /etc/NetworkManager/conf.d/99-rowyn-managed.conf
            test "$(readlink -f /etc/systemd/system/default.target)" = /usr/lib/systemd/system/graphical.target
            test -e /etc/systemd/system/display-manager.service
            test -e /etc/systemd/system/multi-user.target.wants/NetworkManager.service
            test "$(readlink /etc/systemd/system/systemd-networkd.service)" = /dev/null
            podman --version
            crun --version
            test "$(readlink /etc/systemd/system/packagekit.service)" = /dev/null
            flatpak remotes --system --columns=name,url > /tmp/rowyn-flatpak-remotes
            grep -F "https://dl.flathub.org/repo/" /tmp/rowyn-flatpak-remotes
            backends=$(QT_QPA_PLATFORM=offscreen LC_ALL=C.UTF-8 plasma-discover --listbackends)
            echo "$backends" | grep -F " * flatpak-backend"
            if echo "$backends" | grep -E " \* (packagekit|snap)-backend"; then
              echo "Native package backend exposed on immutable OS" >&2
              exit 1
            fi
            distrobox-create --help > /tmp/rowyn-distrobox-help
            grep -F "default: docker.io/library/ubuntu:26.10" /tmp/rowyn-distrobox-help
            test "$(netplan get network.renderer)" = NetworkManager
            netplan generate --root-dir /
            test -s /run/NetworkManager/system-connections/netplan-all-en.nmconnection
            test -s /run/NetworkManager/system-connections/netplan-all-eth.nmconnection
            if test -f /run/udev/rules.d/90-netplan.rules; then
              ! grep -F "NM_UNMANAGED}=\"1\"" /run/udev/rules.d/90-netplan.rules
            fi
          '
          {
            echo '### Image'
            sudo podman image inspect rowyn:ci --format '- size: {{.Size}} bytes'
            sudo podman image inspect rowyn:ci --format '- local digest: {{.Digest}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push immutable image and spike alias to GHCR
        id: publish
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_ref="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          digest_file="${RUNNER_TEMP}/rowyn-image.digest"

          echo "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag rowyn:ci "${image_ref}"
          sudo podman tag rowyn:ci "${IMAGE_REPOSITORY}:spike"

          sudo podman push --digestfile "${digest_file}" "${image_ref}"
          image_digest="$(cat "${digest_file}")"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Keep the human-friendly spike tag, but never use it as the input to
          # a downstream job. The ISO consumes image_ref@image_digest below.
          sudo podman push "${IMAGE_REPOSITORY}:spike"

          {
            echo "image_ref=${image_ref}"
            echo "image_digest=${image_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '### Published image'
            echo "- ref: \`${image_ref}\`"
            echo "- digest: \`${image_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write immutable image metadata
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          mkdir -p output
          jq -n \
            --arg image "${IMAGE_REF}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{image: $image, digest: $digest, source_sha: $source_sha, run_id: $run_id}' \
            > output/image-build-metadata.json

      - name: Upload immutable image metadata
        uses: actions/upload-artifact@v4
        with:
          name: rowyn-image-metadata-${{ github.sha }}
          path: output/image-build-metadata.json
          retention-days: 7
          if-no-files-found: error

  # Sign the exact published image before the custom installer environment
  # consumes it. The installer embeds the signature bundle and the digest;
  # unsigned registry sources are rejected by the live daemon.
  sign:
    name: Sign published image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'kyth-os/Rowyn'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Sign exact image digest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${IMAGE_REF}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  # The stable update channel is a separate promotion boundary. It requires
  # both the existing keyless attestation and a repository-controlled static
  # key signature before moving the exact published digest to :stable.
  promote:
    name: Promote verified image to stable
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'kyth-os/Rowyn'
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Install Skopeo
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          command -v skopeo
          skopeo --version

      - name: Sign exact image with update-channel key
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROWYN_UPDATE_SIGNING_KEY: ${{ secrets.ROWYN_UPDATE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.ROWYN_UPDATE_SIGNING_PASSWORD }}
        run: |
          test -n "${IMAGE_REF}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -s "keys/update.pub"
          test -n "${ROWYN_UPDATE_SIGNING_KEY}"
          test -n "${COSIGN_PASSWORD}"
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://ROWYN_UPDATE_SIGNING_KEY "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify update-channel signature
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          test -s "keys/update.pub"
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          cosign verify --key keys/update.pub "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Keep this check immediately before the tag move. Workflow-level
      # concurrency cancels older main runs; this rejects reruns that survive
      # cancellation after main has advanced.
      - name: Reject stale main before stable promotion
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "${GH_TOKEN}"
          test -n "${GITHUB_REPOSITORY}"
          expected_sha="${EXPECTED_SHA:-}"
          [[ "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]
          main_head_sha="$(
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq 'if (.ref == "refs/heads/main" and .object.type == "commit" and (.object.sha | type == "string") and (.object.sha | test("^[0-9a-f]{40}$"))) then .object.sha else error("unexpected main ref response") end'
          )"
          [[ "${main_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${main_head_sha}" != "${expected_sha}" ]]; then
            echo "main advanced from ${expected_sha} to ${main_head_sha}; refusing stable promotion" >&2
            exit 1
          fi

      - name: Promote exact digest to stable
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          echo "${GITHUB_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --preserve-digests \
            "docker://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "docker://${IMAGE_NAME}:stable"

      - name: Verify stable tag digest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/kyth-os/rowyn" ]]
          stable_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_NAME}:stable")"
          [[ "${stable_digest}" == "${IMAGE_DIGEST}" ]]
