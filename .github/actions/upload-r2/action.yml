name: Upload to Cloudflare R2
description: >-
  Upload a Rowyn installer ISO to Cloudflare R2 as an immutable build set plus
  a channel pointer set, then prune old build sets.
inputs:
  r2-access-key-id:
    description: Access key ID for R2 bucket.
    required: true
  r2-secret-access-key:
    description: Secret access key for R2 bucket.
    required: true
  r2-endpoint-url:
    description: Cloudflare R2 S3 endpoint URL.
    required: false
  r2-account-id:
    description: Cloudflare Account ID (to construct endpoint if r2-endpoint-url is not set).
    required: false
  iso-path:
    description: Path of the built ISO (uploaded straight from here under the new keys).
    required: true
  immutable-name:
    description: Immutable ISO key, rowyn-live-<channel>-<date>-<sha8>-<run>-<attempt>.iso.
    required: true
  pointer-name:
    description: Channel pointer ISO key, rowyn-live-<channel>.iso (overwritten every build).
    required: true
  source-dir:
    description: >-
      Directory holding the renamed companions (<name>.sha256, <name>.sigstore.json,
      <name>.json) for both the immutable and the pointer name.
    required: true
  bucket:
    description: R2 bucket name.
    required: false
    default: rowyn-releases
  retention-keep:
    description: Immutable ISO builds to keep per channel; older build sets are purged after upload.
    required: false
    default: "5"
runs:
  using: composite
  steps:
    - name: Run R2 upload script
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT_URL: ${{ inputs.r2-endpoint-url }}
        R2_ACCOUNT_ID: ${{ inputs.r2-account-id }}
        ISO_PATH: ${{ inputs.iso-path }}
        IMMUTABLE_NAME: ${{ inputs.immutable-name }}
        POINTER_NAME: ${{ inputs.pointer-name }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail

        if [[ -n "${R2_ENDPOINT_URL:-}" ]]; then
          R2_ENDPOINT="${R2_ENDPOINT_URL%/}"
        elif [[ "${R2_ACCOUNT_ID:-}" == https://* ]]; then
          R2_ENDPOINT="${R2_ACCOUNT_ID%/}"
        elif [[ -n "${R2_ACCOUNT_ID:-}" ]]; then
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        else
          echo "::error::Set r2-endpoint-url or r2-account-id."
          exit 1
        fi

        if [[ ! "${R2_ENDPOINT}" =~ ^https://[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com$ ]]; then
          echo "::error::Invalid R2 endpoint URL: ${R2_ENDPOINT}"
          echo "::error::Expected a value like https://<account-id>.r2.cloudflarestorage.com"
          exit 1
        fi

        # Shared with the retention step below.
        echo "R2_ENDPOINT=${R2_ENDPOINT}" >> "${GITHUB_ENV}"

        test -f "${ISO_PATH}"

        # Immutable build set: ISO straight from the original file (no local copy).
        aws s3 cp "${ISO_PATH}" "s3://${BUCKET}/${IMMUTABLE_NAME}" \
          --endpoint-url "${R2_ENDPOINT}" --no-progress
        for suffix in .sha256 .sigstore.json .json; do
          aws s3 cp "${SOURCE_DIR}/${IMMUTABLE_NAME}${suffix}" \
            "s3://${BUCKET}/${IMMUTABLE_NAME}${suffix}" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress
        done

        # Channel pointer set: server-side copy of the ISO from the immutable
        # key (no second 5 GB upload); fall back to a plain upload if the copy
        # is refused.
        if ! aws s3 cp "s3://${BUCKET}/${IMMUTABLE_NAME}" "s3://${BUCKET}/${POINTER_NAME}" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress; then
          echo "::warning::Server-side copy failed; uploading the pointer ISO directly."
          aws s3 cp "${ISO_PATH}" "s3://${BUCKET}/${POINTER_NAME}" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress
        fi
        for suffix in .sha256 .sigstore.json .json; do
          aws s3 cp "${SOURCE_DIR}/${POINTER_NAME}${suffix}" \
            "s3://${BUCKET}/${POINTER_NAME}${suffix}" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress
        done

    # Retention runs after a successful upload and purges immutable build
    # sets beyond the newest few per channel. It must never fail a release:
    # the plan only ever names strict immutable-build keys, and the step is
    # continue-on-error so a retention outage cannot block publishing.
    - name: Purge old ISO builds from R2 (keep newest ${{ inputs.retention-keep }} per channel)
      shell: bash
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        BUCKET: ${{ inputs.bucket }}
        RETENTION_KEEP: ${{ inputs.retention-keep }}
      run: |
        set -euo pipefail

        if [[ -z "${R2_ENDPOINT:-}" ]]; then
          echo "::warning::R2_ENDPOINT is unset; skipping R2 retention."
          exit 0
        fi

        python3 "${{ github.action_path }}/../../../build/r2_retention.py" \
          --bucket "${BUCKET}" \
          --endpoint-url "${R2_ENDPOINT}" \
          --keep "${RETENTION_KEEP}"
