# Rowyn automatic update policy (read by rowyn-update-watcher).
# Copy to /etc/rowyn/update-policy.conf to override; the /etc file wins.
# Format: key=value, one per line, '#' starts a comment.
# Fails closed: an unknown key, a bad value or a malformed line makes the
# watcher refuse to auto-stage until fixed. Manual updates from the Hub
# are never affected by this file.

# Stage updates automatically in the background (applied on next reboot).
AutoStage=yes
# Allow automatic staging while running on battery power.
AllowOnBattery=no
# Allow automatic staging on a metered connection.
AllowMetered=no
