# Boot splash kernel arguments for installed Rowyn systems.
# bootc merges /usr/lib/bootc/kargs.d/*.toml into each installed/staged
# deployment. `quiet` and loglevel limit kernel output; `splash` enables
# Plymouth. systemd status needs separate switches: quiet alone can leave
# service progress scrolling during boot and shutdown, so silence status in
# both the initrd and real root.
kargs = ["quiet", "splash", "loglevel=3", "rd.systemd.show_status=0", "systemd.show_status=0"]
